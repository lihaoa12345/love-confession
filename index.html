<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>我爱你 ❤</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 25%, #f093fb 50%, #f5576c 75%, #fda085 100%);
            background-size: 400% 400%;
            animation: gradientShift 15s ease infinite;
            font-family: 'PingFang SC', 'Microsoft YaHei', sans-serif;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            position: relative;
        }

        @keyframes gradientShift {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        .container {
            text-align: center;
            z-index: 10;
            padding: 20px;
        }

        .couple-image {
            width: 320px;
            height: 320px;
            border-radius: 50%;
            object-fit: cover;
            box-shadow: 0 20px 60px rgba(255, 105, 180, 0.5),
                        0 0 80px rgba(255, 182, 193, 0.3);
            border: 6px solid rgba(255, 255, 255, 0.4);
            animation: float 4s ease-in-out infinite;
            margin-bottom: 30px;
        }

        @keyframes float {
            0%, 100% { transform: translateY(0px); }
            50% { transform: translateY(-15px); }
        }

        .title {
            font-size: 3.5rem;
            font-weight: bold;
            color: white;
            text-shadow: 0 4px 20px rgba(255, 20, 147, 0.6),
                         0 0 40px rgba(255, 182, 193, 0.5);
            margin-bottom: 20px;
            opacity: 0;
            animation: fadeInUp 1.5s ease forwards 0.5s;
        }

        .love-text {
            font-size: 1.5rem;
            color: rgba(255, 255, 255, 0.95);
            line-height: 2;
            max-width: 600px;
            margin: 0 auto 30px;
            text-shadow: 0 2px 10px rgba(255, 105, 180, 0.4);
            opacity: 0;
            animation: fadeInUp 1.5s ease forwards 1.2s;
        }

        .love-text p {
            margin-bottom: 10px;
        }

        .heart-btn {
            background: linear-gradient(135deg, #ff6b9d, #c44569);
            color: white;
            border: none;
            padding: 18px 50px;
            font-size: 1.3rem;
            border-radius: 50px;
            cursor: pointer;
            box-shadow: 0 10px 30px rgba(255, 107, 157, 0.5);
            transition: all 0.3s ease;
            opacity: 0;
            animation: fadeInUp 1.5s ease forwards 2s, pulse 2s ease-in-out infinite 3.5s;
            font-weight: bold;
        }

        .heart-btn:hover {
            transform: scale(1.1);
            box-shadow: 0 15px 40px rgba(255, 107, 157, 0.7);
        }

        @keyframes pulse {
            0%, 100% { box-shadow: 0 10px 30px rgba(255, 107, 157, 0.5); }
            50% { box-shadow: 0 10px 50px rgba(255, 107, 157, 0.9), 0 0 30px rgba(255, 182, 193, 0.6); }
        }

        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .floating-heart {
            position: fixed;
            font-size: 2rem;
            pointer-events: none;
            animation: floatUp 4s ease-out forwards;
            z-index: 100;
        }

        @keyframes floatUp {
            0% {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
            100% {
                opacity: 0;
                transform: translateY(-100vh) scale(1.5) rotate(360deg);
            }
        }

        .sparkle {
            position: absolute;
            width: 4px;
            height: 4px;
            background: white;
            border-radius: 50%;
            animation: sparkle 3s ease-in-out infinite;
        }

        @keyframes sparkle {
            0%, 100% { opacity: 0; transform: scale(0); }
            50% { opacity: 1; transform: scale(1); }
        }

        .big-heart {
            position: fixed;
            top: 50%;
            left: 50%;
            font-size: 0;
            transform: translate(-50%, -50%);
            z-index: 200;
            pointer-events: none;
        }

        .big-heart.show {
            animation: heartBurst 1s ease-out forwards;
        }

        @keyframes heartBurst {
            0% { font-size: 0; opacity: 1; }
            50% { font-size: 20rem; opacity: 0.8; }
            100% { font-size: 25rem; opacity: 0; }
        }

        @media (max-width: 768px) {
            .title {
                font-size: 2.2rem;
            }
            .love-text {
                font-size: 1.1rem;
                padding: 0 20px;
            }
            .couple-image {
                width: 240px;
                height: 240px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <svg class="couple-image" viewBox="0 0 320 320" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="幸福情侣">
            <defs>
                <radialGradient id="bgGrad" cx="50%" cy="42%" r="65%">
                    <stop offset="0%" stop-color="#ffd1e8"/>
                    <stop offset="55%" stop-color="#ff8ec7"/>
                    <stop offset="100%" stop-color="#9b5de5"/>
                </radialGradient>
                <radialGradient id="glow" cx="50%" cy="50%" r="50%">
                    <stop offset="0%" stop-color="#fff" stop-opacity="0.6"/>
                    <stop offset="100%" stop-color="#fff" stop-opacity="0"/>
                </radialGradient>
                <linearGradient id="heartGrad" x1="0%" y1="0%" x2="100%" y2="100%">
                    <stop offset="0%" stop-color="#ff5d8f"/>
                    <stop offset="100%" stop-color="#c026d3"/>
                </linearGradient>
            </defs>
            <circle cx="160" cy="160" r="150" fill="url(#bgGrad)"/>
            <circle cx="160" cy="160" r="150" fill="none" stroke="rgba(255,255,255,0.35)" stroke-width="2"/>
            <circle cx="160" cy="150" r="120" fill="url(#glow)"/>

            <path d="M148 112 C140 78 108 70 88 92 C70 112 66 158 78 202 C84 222 96 232 108 226 C100 202 98 168 104 140 C110 118 124 108 140 110 C146 111 148 112 148 112 Z" fill="#2c1640"/>
            <path d="M100 162 Q118 154 138 163 L158 244 L72 244 Z" fill="url(#heartGrad)"/>
            <path d="M186 162 Q205 154 224 163 L248 244 L162 244 Z" fill="#4a235a"/>
            <path d="M110 160 L128 160 L130 178 L108 178 Z" fill="#ffd4bc"/>
            <path d="M194 160 L212 160 L214 178 L192 178 Z" fill="#f0c2a0"/>

            <circle cx="118" cy="125" r="38" fill="#ffe0cc"/>
            <circle cx="202" cy="125" r="38" fill="#f5c9a8"/>

            <path d="M80 120 C84 88 108 76 118 78 C132 76 152 88 156 120 C146 106 134 108 126 114 C118 102 106 104 98 114 C90 108 82 110 80 120 Z" fill="#2c1640"/>
            <path d="M166 120 C170 88 192 76 202 78 C214 76 234 88 238 120 C230 107 218 105 208 110 C198 100 184 104 178 112 C172 108 166 110 166 120 Z" fill="#1a0e2b"/>
            <path d="M96 96 L102 88 L108 98 Z" fill="#ff5d8f"/>

            <path d="M100 128 Q105 123 110 128" stroke="#2c1640" stroke-width="2.6" fill="none" stroke-linecap="round"/>
            <path d="M126 128 Q131 123 136 128" stroke="#2c1640" stroke-width="2.6" fill="none" stroke-linecap="round"/>
            <path d="M188 128 Q193 123 198 128" stroke="#1a0e2b" stroke-width="2.6" fill="none" stroke-linecap="round"/>
            <path d="M214 128 Q219 123 224 128" stroke="#1a0e2b" stroke-width="2.6" fill="none" stroke-linecap="round"/>
            <circle cx="98" cy="140" r="5.5" fill="#ff8fb8" opacity="0.65"/>
            <circle cx="138" cy="140" r="5.5" fill="#ff8fb8" opacity="0.65"/>
            <circle cx="188" cy="140" r="5" fill="#e07a9e" opacity="0.5"/>
            <circle cx="222" cy="140" r="5" fill="#e07a9e" opacity="0.5"/>
            <path d="M113 147 Q118 151 123 147" stroke="#c0396b" stroke-width="2" fill="none" stroke-linecap="round"/>
            <path d="M197 147 Q202 151 207 147" stroke="#8a2a55" stroke-width="2" fill="none" stroke-linecap="round"/>

            <path d="M160 122 C153 115 143 117 143 127 C143 137 160 148 160 148 C160 148 177 137 177 127 C177 117 167 115 160 122 Z" fill="url(#heartGrad)" stroke="#fff" stroke-width="1.5"/>

            <circle cx="80" cy="92" r="2.5" fill="#fff" opacity="0.85"/>
            <circle cx="244" cy="100" r="2" fill="#fff" opacity="0.7"/>
            <g transform="translate(82,205) scale(0.9)">
                <path d="M0 6 C-4 0 -12 0 -12 -6 C-12 -12 -6 -14 0 -7 C6 -14 12 -12 12 -6 C12 0 4 0 0 6 Z" fill="#ff5d8f"/>
            </g>
            <g transform="translate(238,205) scale(0.9)">
                <path d="M0 6 C-4 0 -12 0 -12 -6 C-12 -12 -6 -14 0 -7 C6 -14 12 -12 12 -6 C12 0 4 0 0 6 Z" fill="#ff8fb8"/>
            </g>
            <g transform="translate(160,58)" fill="#fff" opacity="0.9">
                <path d="M0 -6 L1.5 -1.5 L6 0 L1.5 1.5 L0 6 L-1.5 1.5 L-6 0 L-1.5 -1.5 Z"/>
            </g>
            <g transform="translate(70,148)" fill="#fff" opacity="0.75">
                <path d="M0 -4 L1 -1 L4 0 L1 1 L0 4 L-1 1 L-4 0 L-1 -1 Z"/>
            </g>
            <g transform="translate(250,154)" fill="#fff" opacity="0.75">
                <path d="M0 -4 L1 -1 L4 0 L1 1 L0 4 L-1 1 L-4 0 L-1 -1 Z"/>
            </g>
        </svg>
        
        <h1 class="title">我 爱 你 ❤</h1>
        
        <div class="love-text">
            <p>遇见你，是我生命中最美好的事情</p>
            <p>你的笑容是我每天最期待的风景</p>
            <p>愿与你共度每一个春夏秋冬</p>
            <p>此生有你，便是圆满 💕</p>
        </div>
        
        <button class="heart-btn" onclick="showLove()">点我收下我的心意 💝</button>
    </div>

    <script>
        function createSparkles() {
            const body = document.body;
            for (let i = 0; i < 50; i++) {
                const sparkle = document.createElement('div');
                sparkle.className = 'sparkle';
                sparkle.style.left = Math.random() * 100 + '%';
                sparkle.style.top = Math.random() * 100 + '%';
                sparkle.style.animationDelay = Math.random() * 3 + 's';
                sparkle.style.animationDuration = (Math.random() * 2 + 2) + 's';
                body.appendChild(sparkle);
            }
        }

        function createHeart(x, y) {
            const hearts = ['❤️', '💕', '💖', '💗', '💓', '💝', '🌹'];
            const heart = document.createElement('div');
            heart.className = 'floating-heart';
            heart.textContent = hearts[Math.floor(Math.random() * hearts.length)];
            heart.style.left = x + 'px';
            heart.style.top = y + 'px';
            heart.style.fontSize = (Math.random() * 1.5 + 1) + 'rem';
            document.body.appendChild(heart);
            
            setTimeout(() => heart.remove(), 4000);
        }

        function showLove() {
            const bigHeart = document.createElement('div');
            bigHeart.className = 'big-heart show';
            bigHeart.textContent = '❤️';
            document.body.appendChild(bigHeart);
            
            for (let i = 0; i < 30; i++) {
                setTimeout(() => {
                    const x = Math.random() * window.innerWidth;
                    const y = window.innerHeight;
                    createHeart(x, y);
                }, i * 100);
            }
            
            setTimeout(() => bigHeart.remove(), 1000);
        }

        document.addEventListener('click', (e) => {
            for (let i = 0; i < 5; i++) {
                setTimeout(() => {
                    createHeart(e.clientX + (Math.random() - 0.5) * 100, 
                               e.clientY + (Math.random() - 0.5) * 50);
                }, i * 50);
            }
        });

        setInterval(() => {
            const x = Math.random() * window.innerWidth;
            createHeart(x, window.innerHeight);
        }, 800);

        createSparkles();
    </script>
</body>
</html>
