<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>我爱你 ❤</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 25%, #f093fb 50%, #f5576c 75%, #fda085 100%);
            background-size: 400% 400%;
            animation: gradientShift 15s ease infinite;
            font-family: 'PingFang SC', 'Microsoft YaHei', sans-serif;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            position: relative;
        }

        @keyframes gradientShift {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        .container {
            text-align: center;
            z-index: 10;
            padding: 20px;
        }

        .couple-image {
            width: 320px;
            height: 320px;
            border-radius: 50%;
            object-fit: cover;
            box-shadow: 0 20px 60px rgba(255, 105, 180, 0.5),
                        0 0 80px rgba(255, 182, 193, 0.3);
            border: 6px solid rgba(255, 255, 255, 0.4);
            animation: float 4s ease-in-out infinite;
            margin-bottom: 30px;
        }

        @keyframes float {
            0%, 100% { transform: translateY(0px); }
            50% { transform: translateY(-15px); }
        }

        .title {
            font-size: 3.5rem;
            font-weight: bold;
            color: white;
            text-shadow: 0 4px 20px rgba(255, 20, 147, 0.6),
                         0 0 40px rgba(255, 182, 193, 0.5);
            margin-bottom: 20px;
            opacity: 0;
            animation: fadeInUp 1.5s ease forwards 0.5s;
        }

        .love-text {
            font-size: 1.5rem;
            color: rgba(255, 255, 255, 0.95);
            line-height: 2;
            max-width: 600px;
            margin: 0 auto 30px;
            text-shadow: 0 2px 10px rgba(255, 105, 180, 0.4);
            opacity: 0;
            animation: fadeInUp 1.5s ease forwards 1.2s;
        }

        .love-text p {
            margin-bottom: 10px;
        }

        .heart-btn {
            background: linear-gradient(135deg, #ff6b9d, #c44569);
            color: white;
            border: none;
            padding: 18px 50px;
            font-size: 1.3rem;
            border-radius: 50px;
            cursor: pointer;
            box-shadow: 0 10px 30px rgba(255, 107, 157, 0.5);
            transition: all 0.3s ease;
            opacity: 0;
            animation: fadeInUp 1.5s ease forwards 2s, pulse 2s ease-in-out infinite 3.5s;
            font-weight: bold;
        }

        .heart-btn:hover {
            transform: scale(1.1);
            box-shadow: 0 15px 40px rgba(255, 107, 157, 0.7);
        }

        @keyframes pulse {
            0%, 100% { box-shadow: 0 10px 30px rgba(255, 107, 157, 0.5); }
            50% { box-shadow: 0 10px 50px rgba(255, 107, 157, 0.9), 0 0 30px rgba(255, 182, 193, 0.6); }
        }

        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .floating-heart {
            position: fixed;
            font-size: 2rem;
            pointer-events: none;
            animation: floatUp 4s ease-out forwards;
            z-index: 100;
        }

        @keyframes floatUp {
            0% {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
            100% {
                opacity: 0;
                transform: translateY(-100vh) scale(1.5) rotate(360deg);
            }
        }

        .sparkle {
            position: absolute;
            width: 4px;
            height: 4px;
            background: white;
            border-radius: 50%;
            animation: sparkle 3s ease-in-out infinite;
        }

        @keyframes sparkle {
            0%, 100% { opacity: 0; transform: scale(0); }
            50% { opacity: 1; transform: scale(1); }
        }

        .big-heart {
            position: fixed;
            top: 50%;
            left: 50%;
            font-size: 0;
            transform: translate(-50%, -50%);
            z-index: 200;
            pointer-events: none;
        }

        .big-heart.show {
            animation: heartBurst 1s ease-out forwards;
        }

        @keyframes heartBurst {
            0% { font-size: 0; opacity: 1; }
            50% { font-size: 20rem; opacity: 0.8; }
            100% { font-size: 25rem; opacity: 0; }
        }

        @media (max-width: 768px) {
            .title {
                font-size: 2.2rem;
            }
            .love-text {
                font-size: 1.1rem;
                padding: 0 20px;
            }
            .couple-image {
                width: 240px;
                height: 240px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <svg class="couple-image" viewBox="0 0 320 320" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="幸福情侣">
            <defs>
                <radialGradient id="bgGrad" cx="50%" cy="42%" r="65%">
                    <stop offset="0%" stop-color="#ffd1e8"/>
                    <stop offset="55%" stop-color="#ff8ec7"/>
                    <stop offset="100%" stop-color="#9b5de5"/>
                </radialGradient>
                <radialGradient id="glow" cx="50%" cy="50%" r="50%">
                    <stop offset="0%" stop-color="#fff" stop-opacity="0.6"/>
                    <stop offset="100%" stop-color="#fff" stop-opacity="0"/>
                </radialGradient>
                <linearGradient id="heartGrad" x1="0%" y1="0%" x2="100%" y2="100%">
                    <stop offset="0%" stop-color="#ff5d8f"/>
                    <stop offset="100%" stop-color="#c026d3"/>
                </linearGradient>
            </defs>
            <circle cx="160" cy="160" r="150" fill="url(#bgGrad)"/>
            <circle cx="160" cy="160" r="150" fill="none" stroke="rgba(255,255,255,0.35)" stroke-width="2"/>
            <circle cx="160" cy="150" r="120" fill="url(#glow)"/>
            <path d="M118 100
                     C98 108 86 140 94 178
                     C100 214 90 234 108 244
                     C114 247 122 244 126 238
                     L134 220
                     C130 206 130 194 138 184
                     C146 176 154 174 156 166
                     C157 160 153 156 156 150
                     C160 143 163 138 158 133
                     C153 126 148 118 142 112
                     C136 104 126 98 118 100 Z"
                  fill="#4a235a" opacity="0.96"/>
            <path d="M118 100
                     C108 102 98 116 96 134
                     C94 158 104 180 116 196
                     C124 208 130 222 134 238
                     C138 232 138 214 138 196
                     C130 182 134 168 144 158
                     C150 150 150 138 146 126
                     C142 114 132 102 118 100 Z"
                  fill="#2c1640" opacity="0.55"/>
            <path d="M202 100
                     C222 108 234 140 226 178
                     C220 214 230 234 212 244
                     C206 247 198 244 194 238
                     L186 220
                     C190 206 190 194 182 184
                     C174 176 166 174 164 166
                     C163 160 167 156 164 150
                     C160 143 157 138 162 133
                     C167 126 172 118 178 112
                     C184 104 194 98 202 100 Z"
                  fill="#2c1640" opacity="0.96"/>
            <path d="M202 100
                     C212 102 222 116 224 134
                     C226 158 216 180 204 196
                     C196 208 190 222 186 238
                     C182 232 182 214 182 196
                     C190 182 186 168 176 158
                     C170 150 170 138 174 126
                     C178 114 188 102 202 100 Z"
                  fill="#1a0e2b" opacity="0.5"/>
            <path d="M160 150
                     C154 142 142 144 142 155
                     C142 166 160 178 160 178
                     C160 178 178 166 178 155
                     C178 144 166 142 160 150 Z"
                  fill="url(#heartGrad)"/>
            <circle cx="100" cy="96" r="3" fill="#fff" opacity="0.8"/>
            <circle cx="232" cy="108" r="2.5" fill="#fff" opacity="0.7"/>
            <circle cx="86" cy="200" r="2.5" fill="#fff" opacity="0.6"/>
            <circle cx="240" cy="206" r="3" fill="#fff" opacity="0.7"/>
            <text x="112" y="262" font-size="22">💕</text>
            <text x="182" y="68" font-size="20">💖</text>
            <text x="60" y="150" font-size="16">✨</text>
            <text x="256" y="156" font-size="16">✨</text>
        </svg>
        
        <h1 class="title">我 爱 你 ❤</h1>
        
        <div class="love-text">
            <p>遇见你，是我生命中最美好的事情</p>
            <p>你的笑容是我每天最期待的风景</p>
            <p>愿与你共度每一个春夏秋冬</p>
            <p>此生有你，便是圆满 💕</p>
        </div>
        
        <button class="heart-btn" onclick="showLove()">点我收下我的心意 💝</button>
    </div>

    <script>
        function createSparkles() {
            const body = document.body;
            for (let i = 0; i < 50; i++) {
                const sparkle = document.createElement('div');
                sparkle.className = 'sparkle';
                sparkle.style.left = Math.random() * 100 + '%';
                sparkle.style.top = Math.random() * 100 + '%';
                sparkle.style.animationDelay = Math.random() * 3 + 's';
                sparkle.style.animationDuration = (Math.random() * 2 + 2) + 's';
                body.appendChild(sparkle);
            }
        }

        function createHeart(x, y) {
            const hearts = ['❤️', '💕', '💖', '💗', '💓', '💝', '🌹'];
            const heart = document.createElement('div');
            heart.className = 'floating-heart';
            heart.textContent = hearts[Math.floor(Math.random() * hearts.length)];
            heart.style.left = x + 'px';
            heart.style.top = y + 'px';
            heart.style.fontSize = (Math.random() * 1.5 + 1) + 'rem';
            document.body.appendChild(heart);
            
            setTimeout(() => heart.remove(), 4000);
        }

        function showLove() {
            const bigHeart = document.createElement('div');
            bigHeart.className = 'big-heart show';
            bigHeart.textContent = '❤️';
            document.body.appendChild(bigHeart);
            
            for (let i = 0; i < 30; i++) {
                setTimeout(() => {
                    const x = Math.random() * window.innerWidth;
                    const y = window.innerHeight;
                    createHeart(x, y);
                }, i * 100);
            }
            
            setTimeout(() => bigHeart.remove(), 1000);
        }

        document.addEventListener('click', (e) => {
            for (let i = 0; i < 5; i++) {
                setTimeout(() => {
                    createHeart(e.clientX + (Math.random() - 0.5) * 100, 
                               e.clientY + (Math.random() - 0.5) * 50);
                }, i * 50);
            }
        });

        setInterval(() => {
            const x = Math.random() * window.innerWidth;
            createHeart(x, window.innerHeight);
        }, 800);

        createSparkles();
    </script>
</body>
</html>
