<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>我爱你 ❤</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 25%, #f093fb 50%, #f5576c 75%, #fda085 100%);
            background-size: 400% 400%;
            animation: gradientShift 15s ease infinite;
            font-family: 'PingFang SC', 'Microsoft YaHei', sans-serif;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            position: relative;
        }

        @keyframes gradientShift {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        .container {
            text-align: center;
            z-index: 10;
            padding: 20px;
        }

        .couple-image {
            width: 320px;
            height: 320px;
            border-radius: 50%;
            object-fit: cover;
            box-shadow: 0 20px 60px rgba(255, 105, 180, 0.5),
                        0 0 80px rgba(255, 182, 193, 0.3);
            border: 6px solid rgba(255, 255, 255, 0.4);
            animation: float 4s ease-in-out infinite;
            margin-bottom: 30px;
        }

        @keyframes float {
            0%, 100% { transform: translateY(0px); }
            50% { transform: translateY(-15px); }
        }

        .title {
            font-size: 3.5rem;
            font-weight: bold;
            color: white;
            text-shadow: 0 4px 20px rgba(255, 20, 147, 0.6),
                         0 0 40px rgba(255, 182, 193, 0.5);
            margin-bottom: 20px;
            opacity: 0;
            animation: fadeInUp 1.5s ease forwards 0.5s;
        }

        .love-text {
            font-size: 1.5rem;
            color: rgba(255, 255, 255, 0.95);
            line-height: 2;
            max-width: 600px;
            margin: 0 auto 30px;
            text-shadow: 0 2px 10px rgba(255, 105, 180, 0.4);
            opacity: 0;
            animation: fadeInUp 1.5s ease forwards 1.2s;
        }

        .love-text p {
            margin-bottom: 10px;
        }

        .heart-btn {
            background: linear-gradient(135deg, #ff6b9d, #c44569);
            color: white;
            border: none;
            padding: 18px 50px;
            font-size: 1.3rem;
            border-radius: 50px;
            cursor: pointer;
            box-shadow: 0 10px 30px rgba(255, 107, 157, 0.5);
            transition: all 0.3s ease;
            opacity: 0;
            animation: fadeInUp 1.5s ease forwards 2s, pulse 2s ease-in-out infinite 3.5s;
            font-weight: bold;
        }

        .heart-btn:hover {
            transform: scale(1.1);
            box-shadow: 0 15px 40px rgba(255, 107, 157, 0.7);
        }

        @keyframes pulse {
            0%, 100% { box-shadow: 0 10px 30px rgba(255, 107, 157, 0.5); }
            50% { box-shadow: 0 10px 50px rgba(255, 107, 157, 0.9), 0 0 30px rgba(255, 182, 193, 0.6); }
        }

        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .floating-heart {
            position: fixed;
            font-size: 2rem;
            pointer-events: none;
            animation: floatUp 4s ease-out forwards;
            z-index: 100;
        }

        @keyframes floatUp {
            0% {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
            100% {
                opacity: 0;
                transform: translateY(-100vh) scale(1.5) rotate(360deg);
            }
        }

        .sparkle {
            position: absolute;
            width: 4px;
            height: 4px;
            background: white;
            border-radius: 50%;
            animation: sparkle 3s ease-in-out infinite;
        }

        @keyframes sparkle {
            0%, 100% { opacity: 0; transform: scale(0); }
            50% { opacity: 1; transform: scale(1); }
        }

        .big-heart {
            position: fixed;
            top: 50%;
            left: 50%;
            font-size: 0;
            transform: translate(-50%, -50%);
            z-index: 200;
            pointer-events: none;
        }

        .big-heart.show {
            animation: heartBurst 1s ease-out forwards;
        }

        @keyframes heartBurst {
            0% { font-size: 0; opacity: 1; }
            50% { font-size: 20rem; opacity: 0.8; }
            100% { font-size: 25rem; opacity: 0; }
        }

        .music-toggle {
            position: fixed;
            top: 20px;
            right: 20px;
            width: 52px;
            height: 52px;
            border-radius: 50%;
            border: 2px solid rgba(255, 255, 255, 0.6);
            background: linear-gradient(135deg, #ff6fa8, #c026d3);
            color: #fff;
            font-size: 1.4rem;
            cursor: pointer;
            z-index: 300;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 6px 20px rgba(192, 38, 211, 0.5);
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }

        .music-toggle:hover {
            transform: scale(1.08);
        }

        .music-toggle.playing {
            animation: spin 6s linear infinite, musicPulse 2s ease-in-out infinite;
        }

        .music-toggle.paused {
            opacity: 0.7;
        }

        @keyframes spin {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }

        @keyframes musicPulse {
            0%, 100% { box-shadow: 0 6px 20px rgba(192, 38, 211, 0.5); }
            50% { box-shadow: 0 6px 30px rgba(255, 105, 180, 0.9), 0 0 20px rgba(255, 182, 193, 0.6); }
        }

        .music-hint {
            position: fixed;
            bottom: 24px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(74, 35, 90, 0.82);
            color: #fff;
            padding: 10px 22px;
            border-radius: 30px;
            font-size: 0.95rem;
            z-index: 300;
            backdrop-filter: blur(6px);
            border: 1px solid rgba(255, 255, 255, 0.25);
            box-shadow: 0 6px 20px rgba(0, 0, 0, 0.25);
            animation: hintBounce 1.8s ease-in-out infinite;
            transition: opacity 0.6s ease, transform 0.6s ease;
            pointer-events: none;
            white-space: nowrap;
        }

        .music-hint.hidden {
            opacity: 0;
            transform: translateX(-50%) translateY(20px);
        }

        @keyframes hintBounce {
            0%, 100% { transform: translateX(-50%) translateY(0); }
            50% { transform: translateX(-50%) translateY(-6px); }
        }

        @media (max-width: 768px) {
            .title {
                font-size: 2.2rem;
            }
            .love-text {
                font-size: 1.1rem;
                padding: 0 20px;
            }
            .couple-image {
                width: 240px;
                height: 240px;
            }
            .music-toggle {
                width: 46px;
                height: 46px;
                font-size: 1.2rem;
                top: 14px;
                right: 14px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <img class="couple-image" src="couple.jpg" alt="幸福情侣亲吻" />
        
        <h1 class="title">我 爱 你 ❤</h1>
        
        <div class="love-text">
            <p>遇见你，是我生命中最美好的事情</p>
            <p>你的笑容是我每天最期待的风景</p>
            <p>愿与你共度每一个春夏秋冬</p>
            <p>此生有你，便是圆满 💕</p>
        </div>
        
        <button class="heart-btn" onclick="showLove()">点我收下我的心意 💝</button>
    </div>

    <button class="music-toggle paused" id="musicToggle" aria-label="背景音乐开关" title="背景音乐">🎵</button>

    <div class="music-hint" id="musicHint">🎵 点击任意处，开启浪漫音乐</div>

    <script>
        function createSparkles() {
            const body = document.body;
            for (let i = 0; i < 50; i++) {
                const sparkle = document.createElement('div');
                sparkle.className = 'sparkle';
                sparkle.style.left = Math.random() * 100 + '%';
                sparkle.style.top = Math.random() * 100 + '%';
                sparkle.style.animationDelay = Math.random() * 3 + 's';
                sparkle.style.animationDuration = (Math.random() * 2 + 2) + 's';
                body.appendChild(sparkle);
            }
        }

        function createHeart(x, y) {
            const hearts = ['❤️', '💕', '💖', '💗', '💓', '💝', '🌹'];
            const heart = document.createElement('div');
            heart.className = 'floating-heart';
            heart.textContent = hearts[Math.floor(Math.random() * hearts.length)];
            heart.style.left = x + 'px';
            heart.style.top = y + 'px';
            heart.style.fontSize = (Math.random() * 1.5 + 1) + 'rem';
            document.body.appendChild(heart);
            
            setTimeout(() => heart.remove(), 4000);
        }

        function showLove() {
            const bigHeart = document.createElement('div');
            bigHeart.className = 'big-heart show';
            bigHeart.textContent = '❤️';
            document.body.appendChild(bigHeart);
            
            for (let i = 0; i < 30; i++) {
                setTimeout(() => {
                    const x = Math.random() * window.innerWidth;
                    const y = window.innerHeight;
                    createHeart(x, y);
                }, i * 100);
            }
            
            setTimeout(() => bigHeart.remove(), 1000);
        }

        document.addEventListener('click', (e) => {
            for (let i = 0; i < 5; i++) {
                setTimeout(() => {
                    createHeart(e.clientX + (Math.random() - 0.5) * 100, 
                               e.clientY + (Math.random() - 0.5) * 50);
                }, i * 50);
            }
        });

        setInterval(() => {
            const x = Math.random() * window.innerWidth;
            createHeart(x, window.innerHeight);
        }, 800);

        const musicToggle = document.getElementById('musicToggle');
        const musicHint = document.getElementById('musicHint');
        let audioCtx = null;
        let masterGain = null;
        let delayGain = null;
        let isPlaying = false;
        let schedulerTimer = null;
        let nextNoteTime = 0;
        let step = 0;
        const tempo = 76;
        const lookahead = 25;
        const scheduleAheadTime = 0.2;

        const N = {
            C3:130.81,D3:146.83,E3:164.81,F3:174.61,G3:196.00,A3:220.00,B3:246.94,
            C4:261.63,D4:293.66,E4:329.63,F4:349.23,G4:392.00,A4:440.00,B4:493.88,
            C5:523.25,D5:587.33,E5:659.25,F5:698.46,G5:783.99,A5:880.00,B5:987.77,
            C6:1046.50
        };

        const chords = [
            { root: N.C3, pad: [N.C4, N.E4, N.G4], melody: [N.E5, N.G5, N.C6, N.C6, N.G5, N.E5, 0, 0] },
            { root: N.G3, pad: [N.G4, N.B4, N.D5], melody: [N.D5, N.B4, N.G4, N.G4, N.B4, N.D5, 0, 0] },
            { root: N.A3, pad: [N.A4, N.C5, N.E5], melody: [N.E5, N.C5, N.A4, N.A4, N.C5, N.E5, 0, 0] },
            { root: N.F3, pad: [N.F4, N.A4, N.C5], melody: [N.C5, N.A4, N.F4, N.F4, N.A4, N.C5, 0, 0] }
        ];

        function setMusicUI(playing) {
            if (playing) {
                musicToggle.classList.add('playing');
                musicToggle.classList.remove('paused');
                musicToggle.textContent = '🎶';
            } else {
                musicToggle.classList.remove('playing');
                musicToggle.classList.add('paused');
                musicToggle.textContent = '🎵';
            }
        }

        function hideHint() {
            musicHint.classList.add('hidden');
            setTimeout(() => musicHint.remove(), 700);
        }

        function initAudio() {
            if (audioCtx) return;
            const Ctx = window.AudioContext || window.webkitAudioContext;
            audioCtx = new Ctx();
            masterGain = audioCtx.createGain();
            masterGain.gain.value = 0.0;
            masterGain.connect(audioCtx.destination);

            const delay = audioCtx.createDelay(1.0);
            delay.delayTime.value = 0.28;
            const feedback = audioCtx.createGain();
            feedback.gain.value = 0.32;
            delayGain = audioCtx.createGain();
            delayGain.gain.value = 0.28;
            delay.connect(feedback);
            feedback.connect(delay);
            delay.connect(delayGain);
            delayGain.connect(masterGain);
        }

        function playNote(freq, time, duration, volume, type) {
            if (!freq) return;
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.type = type || 'triangle';
            osc.frequency.value = freq;

            gain.gain.setValueAtTime(0.0001, time);
            gain.gain.linearRampToValueAtTime(volume, time + 0.02);
            gain.gain.exponentialRampToValueAtTime(0.0008, time + duration);

            osc.connect(gain);
            gain.connect(masterGain);
            gain.connect(delayGain);
            osc.start(time);
            osc.stop(time + duration + 0.05);
        }

        function scheduleStep(s, time) {
            const chord = chords[Math.floor(s / 8)];
            const pos = s % 8;
            const eighth = 60.0 / tempo / 2;

            if (pos === 0) {
                playNote(chord.root, time, eighth * 6, 0.16, 'sine');
                chord.pad.forEach((n, i) => {
                    playNote(n, time + i * 0.035, eighth * 2, 0.05, 'triangle');
                });
            }

            const mel = chord.melody[pos];
            if (mel) {
                playNote(mel, time, eighth * 1.6, 0.22, 'triangle');
                playNote(mel * 2, time, eighth * 1.2, 0.05, 'sine');
            }
        }

        function scheduler() {
            while (nextNoteTime < audioCtx.currentTime + scheduleAheadTime) {
                scheduleStep(step, nextNoteTime);
                nextNoteTime += 60.0 / tempo / 2;
                step = (step + 1) % 32;
            }
            schedulerTimer = setTimeout(scheduler, lookahead);
        }

        function startMusic() {
            if (isPlaying) return;
            initAudio();
            const begin = () => {
                if (audioCtx.state !== 'running') return;
                isPlaying = true;
                step = 0;
                nextNoteTime = audioCtx.currentTime + 0.1;
                masterGain.gain.cancelScheduledValues(audioCtx.currentTime);
                masterGain.gain.setValueAtTime(Math.max(masterGain.gain.value, 0.0001), audioCtx.currentTime);
                masterGain.gain.linearRampToValueAtTime(0.9, audioCtx.currentTime + 1.2);
                scheduler();
                setMusicUI(true);
                hideHint();
            };
            if (audioCtx.state === 'suspended') {
                audioCtx.resume().then(begin).catch(() => {});
            } else {
                begin();
            }
        }

        function pauseMusic() {
            if (!isPlaying) return;
            isPlaying = false;
            clearTimeout(schedulerTimer);
            if (audioCtx) {
                masterGain.gain.cancelScheduledValues(audioCtx.currentTime);
                masterGain.gain.setValueAtTime(masterGain.gain.value, audioCtx.currentTime);
                masterGain.gain.linearRampToValueAtTime(0.0, audioCtx.currentTime + 0.4);
            }
            setMusicUI(false);
        }

        musicToggle.addEventListener('click', (e) => {
            e.stopPropagation();
            if (isPlaying) pauseMusic(); else startMusic();
        });

        const firstInteract = () => {
            startMusic();
            window.removeEventListener('pointerdown', firstInteract);
            window.removeEventListener('touchstart', firstInteract);
            window.removeEventListener('keydown', firstInteract);
        };
        window.addEventListener('pointerdown', firstInteract);
        window.addEventListener('touchstart', firstInteract);
        window.addEventListener('keydown', firstInteract);

        try { startMusic(); } catch (e) {}

        createSparkles();
    </script>
</body>
</html>
